services:
  namenode:
    build: ./namenode
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
      - ./data/:/hadoop-data/input
      - ./map_reduce/:/hadoop-data/map_reduce
    environment:
      - CLUSTER_NAME=test
    ports:
      - "9871:9870"
      - "8021:8020"
    networks:
      - hadoop_network

  resourcemanager:
    build: ./resourcemanager
    restart: on-failure
    depends_on:
      - namenode
      - datanode1
      - datanode2
      - datanode3
    ports:
      - "8090:8088"
    networks:
      - hadoop_network

  historyserver:
    build: ./historyserver
    depends_on:
      - namenode
      - datanode1
      - datanode2
    volumes:
      - hadoop_historyserver:/hadoop/yarn/timeline
    ports:
      - "8189:8188"
    networks:
      - hadoop_network

  nodemanager1:
    build: ./nodemanager
    depends_on:
      - namenode
      - datanode1
      - datanode2
    ports:
      - "8043:8042"
    networks:
      - hadoop_network

  datanode1:
    build: ./datanode
    depends_on:
      - namenode
    volumes:
      - hadoop_datanode1:/hadoop/dfs/data
    networks:
      - hadoop_network

  datanode2:
    build: ./datanode
    depends_on:
      - namenode
    volumes:
      - hadoop_datanode2:/hadoop/dfs/data
    networks:
      - hadoop_network

  datanode3:
    build: ./datanode
    depends_on:
      - namenode
    volumes:
      - hadoop_datanode3:/hadoop/dfs/data
    networks:
      - hadoop_network

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${HIVE_DB_NAME}
      POSTGRES_USER: ${HIVE_DB_USER}
      POSTGRES_PASSWORD: ${HIVE_DB_PASSWORD}
    volumes:
      - hive_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - hadoop_network

  metastore:
    image: apache/hive:4.0.1
    depends_on:
      postgres:
        condition: service_healthy
      namenode:
        condition: service_started
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      HIVE_CUSTOM_CONF_DIR: /hive_custom_conf
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/${HIVE_DB_NAME}
        -Djavax.jdo.option.ConnectionUserName=${HIVE_DB_USER}
        -Djavax.jdo.option.ConnectionPassword=${HIVE_DB_PASSWORD}
    volumes:
      - ./hive/conf:/hive_custom_conf:ro
      - ./drivers/postgresql-42.7.14.jar:/opt/hive/lib/postgres.jar:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/9083"]
      start_period: 90s
      interval: 10s
      timeout: 5s
      retries: 24
    networks:
      - hadoop_network

  hiveserver2:
    image: apache/hive:4.0.1
    depends_on:
      metastore:
        condition: service_healthy
    environment:
      SERVICE_NAME: hiveserver2
      IS_RESUME: "true"
      HIVE_CUSTOM_CONF_DIR: /hive_custom_conf
      HIVESERVER2_PID_DIR: /run/hiveserver2
      SERVICE_OPTS: >-
        -Dhive.metastore.uris=thrift://metastore:9083
    volumes:
      - ./hive/conf:/hive_custom_conf:ro
    tmpfs:
      - /run/hiveserver2:mode=0700,uid=1000,gid=1000
    ports:
      - "10000:10000"
      - "10002:10002"
    networks:
      - hadoop_network

volumes:
  hadoop_namenode:
  hadoop_datanode1:
  hadoop_datanode2:
  hadoop_datanode3:
  hadoop_historyserver:
  hive_postgres_data:

networks:
  hadoop_network:
